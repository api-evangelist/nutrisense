name: NutriSense
description: >-
  NutriSense is a metabolic health and wellness company that pairs continuous
  glucose monitoring (CGM) with 1:1 registered-dietitian coaching and a mobile
  app. Members receive glucose biosensors, real-time and historical glucose
  analytics, AI-assisted pattern insights, stress-management sessions, and video
  consults with credentialed, glucose-certified nutritionists to build
  sustainable nutrition, weight-loss, and metabolic-health habits. Nutrisense
  runs a consumer product with a member web and mobile app experience; as of this
  profile it does not publish a public developer API, developer portal, or
  OpenAPI. It does publish a machine-readable llms.txt at nutrisense.io/llms.txt.
